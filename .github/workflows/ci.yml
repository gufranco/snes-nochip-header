name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Lint
        run: ruff check .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

      - name: Check formatting
        run: ruff format --check .

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    env:
      PYTHONPATH: .:packages/snes-mapper
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run every test module
        run: |
          failed=0
          for module in romimage/*.test.py conformance/*.test.py; do
            echo "::group::${module}"
            python3 "${module}" || failed=1
            echo "::endgroup::"
          done
          exit "${failed}"

      - name: Replay the corpus
        run: python3 conformance/corpus.py

      - name: Coverage, which fails below 100%
        run: |
          pip install coverage
          python3 -m coverage erase
          for module in romimage/*.test.py conformance/*.test.py; do
            python3 -m coverage run -a "${module}" >/dev/null
          done
          python3 -m coverage report

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      # pnpm has no equivalent of `npm audit signatures`, which verified registry
      # provenance attestations. This checks the tooling for known advisories
      # instead. It is a narrower guarantee and is here so the gap is visible
      # rather than silently dropped along with the command that used to fill it.
      - name: Check the release tooling for known advisories
        run: pnpm audit --audit-level=high

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
